{% extends 'base.html' %}

{% block title %}Пароль изменен{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3 class="text-center">Пароль успешно изменен</h3>
            </div>
            <div class="card-body text-center">
                <p class="lead">Ваш пароль был успешно изменен.</p>
                <p>Теперь вы можете войти с новым паролем.</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary">Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
