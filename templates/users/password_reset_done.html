{% extends 'base.html' %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3 class="text-center">Письмо отправлено</h3>
            </div>
            <div class="card-body text-center">

        </div>
    </div>

{% endblock %}
