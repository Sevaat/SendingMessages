{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Восстановление пароля</h3>
            </div>
            <div class="card-body">
                <p class="text-muted">Введите свой email, и мы отправим вам инструкцию по восстановлению пароля.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Отправить</button>
                        <a href="{% url 'users:login' %}" class="btn btn-secondary">Вернуться к входу</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
